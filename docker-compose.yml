name: keycraft-3d

services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu: PostgreSQL 17 tích hợp sẵn pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: keycraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keycraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycraft_secret}
      POSTGRES_DB: ${POSTGRES_DB:-keycraft_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycraft} -d ${POSTGRES_DB:-keycraft_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Bộ nhớ đệm & Bảo mật: Redis 7 Alpine (Auth Rate Limit, CAPTCHA & Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: keycraft-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Ứng dụng Web Next.js 16 (Three.js 3D Studio, Web Audio & AI Architect)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keycraft-app
    restart: unless-stopped
    # Không mở cổng ra ngoài: mọi request phải đi qua nginx (service `proxy`) để IP client không giả được
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-keycraft}:${POSTGRES_PASSWORD:-keycraft_secret}@postgres:5432/${POSTGRES_DB:-keycraft_db}
      REDIS_URL: redis://redis:6379
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Bắt buộc khoá thật (>= 32 ký tự): thiếu thì `docker compose up` dừng ngay với thông báo này
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env (openssl rand -base64 48)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Đặt JWT_REFRESH_SECRET trong .env (openssl rand -base64 48)}
      # Chỉ tin X-Forwarded-For do đúng 1 proxy (nginx bên dưới) ghi
      TRUSTED_PROXY_HOPS: 1
      AI_RATE_LIMIT_MAX_REQUESTS: ${AI_RATE_LIMIT_MAX_REQUESTS:-10}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. Reverse proxy nginx: cổng vào duy nhất, ghi đè X-Forwarded-For bằng IP thật
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: keycraft-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
