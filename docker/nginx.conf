# Reverse proxy đứng trước app Next.js trong Docker Compose.
#
# Vì sao cần: app đọc IP client từ X-Forwarded-For để rate limit / khoá IP. Nếu app nhận request
# thẳng từ Internet, client tự đặt được header này (mỗi request một IP giả = lách rate limit).
# nginx GHI ĐÈ header bằng IP thật của kết nối TCP ($remote_addr), và app được cấu hình
# TRUSTED_PROXY_HOPS=1 để chỉ tin đúng giá trị nginx ghi.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_tokens off;

  # Chat AI cho phép tối đa 8MB tệp (base64 ~11MB) + phần văn bản
  client_max_body_size 12m;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Ghi đè, KHÔNG nối thêm ($proxy_add_x_forwarded_for sẽ giữ lại giá trị giả của client)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Câu trả lời AI stream (SSE): không đệm, gửi từng chữ ngay
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
